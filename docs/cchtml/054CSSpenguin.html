<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styleShared.css" />
    <link rel="stylesheet" href="../css/ccStyleNavigations.css" />
    <link rel="stylesheet" href="../css/styleBootstrapGrid.css" />
    <link rel="stylesheet" href="../css/styleDetails.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="../cccss/penguin.css" />

    <!-- Primary Meta Tags -->
    <title>Georgia Jean - freeCodeCamp Penguin</title>
    <meta name="title" content="Portfolio" />
    <meta
      name="description"
      content="Portfolio of a lifelong learner and analytical problem solver"
    />
  </head>

  <body>
    <!-- Main navigation -->
    <nav
      data-include="../partials/ccNavBar.html"
      role="navigation"
      aria-label="Primary navigation"
    ></nav>

    <!-- Side menu -->
    <aside
      data-include="../partials/ccSideMenu.html"
      role="navigation"
      aria-label="Side menu"
    ></aside>

    <!-- Contact menu -->
    <aside
      data-include="../partials/contactMenu.html"
      role="contact"
      aria-label="Contact Card"
    ></aside>
    <nav class="me-3" style="--bs-breadcrumb-divider: &quot;>&quot;" aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-end">
        <li class="breadcrumb-item"><a class="gen-link-cc" href="../index.html">Home</a></li>
        <li class="breadcrumb-item">
          <a class="gen-link-cc" href="../ccProjects.html">freeCodeCamp Work</a>
        </li>
        <li class="breadcrumb-item">
          <a class="gen-link-cc" href="../ccCSS.html">freeCodeCamp CSS</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Lesson Work</li>
      </ol>
    </nav>

    <main id="main-content" role="main">
      <!-- Decorative background elements -->
      <div class="left-mountain" aria-hidden="true"></div>
      <div class="back-mountain" aria-hidden="true"></div>
      <div class="sun" aria-hidden="true"></div>

      <!-- Penguin illustration -->
      <div class="penguin" aria-hidden="true">
        <div class="penguin-head">
          <div class="face left"></div>
          <div class="face right"></div>
          <div class="chin"></div>

          <div class="eye left">
            <div class="eye-lid"></div>
          </div>
          <div class="eye right">
            <div class="eye-lid"></div>
          </div>

          <div class="blush left"></div>
          <div class="blush right"></div>

          <div class="beak top"></div>
          <div class="beak bottom"></div>
        </div>

        <div class="shirt">
          <p class="tiny-text text-center">I 🌰 Squirrels</p>
        </div>

        <div class="penguin-body">
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="foot left"></div>
          <div class="foot right"></div>
        </div>
      </div>

      <div class="ground" aria-hidden="true"></div>
    </main>

    <!-- Footer -->
    <footer data-include="../partials/footer.html" role="contentinfo" aria-label="Footer"></footer>

    <script src="../js/script.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
