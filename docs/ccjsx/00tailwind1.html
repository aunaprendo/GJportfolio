<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Stylesheets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        },
      };
    </script>

    <link rel="stylesheet" href="../css/styleShared.css" />
    <link rel="stylesheet" href="../css/ccStyleNavigations.css" />
    <link rel="stylesheet" href="../css/styleBootstrapGrid.css" />
    <link rel="stylesheet" href="../css/styleDetails.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Primary Meta Tags -->
    <title>Error Message Component</title>
    <meta name="title" content="Portfolio" />
    <meta
      name="description"
      content="Portfolio of a lifelong learner and analytical problem solver"
    />
  </head>

  <body>
    <!-- Main navigation -->
    <nav
      data-include="../partials/ccNavBar.html"
      role="navigation"
      aria-label="Primary navigation"
    ></nav>

    <!-- Side menu -->
    <aside
      data-include="../partials/ccSideMenu.html"
      role="navigation"
      aria-label="Side menu"
    ></aside>

    <!-- Contact menu -->
    <aside
      data-include="../partials/contactMenu.html"
      role="contact"
      aria-label="Contact Card"
    ></aside>
    <nav
      class="mb-1 me-3 mt-3"
      style="--bs-breadcrumb-divider: &quot;>&quot;"
      aria-label="breadcrumb"
    >
      <ol class="breadcrumb justify-content-end">
        <li class="breadcrumb-item"><a class="gen-link-cc" href="../index.html">Home</a></li>
        <li class="breadcrumb-item">
          <a class="gen-link-cc" href="../ccProjects.html">freeCodeCamp Work</a>
        </li>
        <li class="breadcrumb-item">
          <a class="gen-link-cc" href="../ccFrontEnd.html">freeCodeCamp Front End</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Lesson Work</li>
      </ol>
    </nav>

    <main>
      <div
        class="bg-[var(--accent-color-ateal)] border-2 border-[var(--accent-color-dteal)] rounded-md md:w-1/2 p-4 mt-5 md:mx-auto flex gap-4 justify-center items-center"
      >
        <p class="text-cyan-700 text-xl">
          <strong>Error!</strong> We are busy hiding nuts. Please try again.
        </p>
        <button
          type="button"
          aria-label="Go back to previous page"
          class="text-cyan-700 text-2xl"
          onclick="history.back()"
        >
          <span aria-hidden>&times;</span>
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer data-include="../partials/footer.html" role="contentinfo" aria-label="Footer"></footer>

    <script src="../js/script.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
