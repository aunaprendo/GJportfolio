<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Message Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="bg-cyan-100 border-2 border-cyan-700 rounded-md md:w-1/2 p-4 mt-4 md:mx-auto flex gap-4 justify-center items-center"
    >
      <p class="text-cyan-700 text-xl">
        <strong>Error!</strong> We are busy hiding nuts. Please try again.
      </p>
      <button aria-label="Dismiss" class="text-cyan-700 text-2xl">
        <span aria-hidden>&times;</span>
      </button>
    </div>
  </body>
</html>
